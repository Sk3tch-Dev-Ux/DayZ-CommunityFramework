//
//  All intervals and durations are in SECONDS.
//  Coordinates are X and Z only — Y (height) is auto-detected
//  from terrain at runtime.
// ============================================================

class PlaneCrash
{
    MinInterval   = 2700;   // Minimum seconds between events  (45 min)
    MaxInterval   = 5400;   // Maximum seconds between events  (90 min)
    EventDuration = 3600;   // How long the event stays active (60 min)

    class Locations
    {
        // Add as many locations as you like.
        // The script picks one at random each time.
        class Loc0  { x = 4521.0;  z = 6234.0; };
        class Loc1  { x = 7312.0;  z = 3187.0; };
        class Loc2  { x = 5850.0;  z = 9102.0; };
    };
};

